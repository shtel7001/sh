name: KRX full market investor batch
# Validate SPAC ETF ETN exclusion against the 240-day KRX market batch.
on:
  push:
    branches:
      - fix/investor-flex-240-diagnostics-20261022
    paths:
      - '.github/workflows/krx-investor-market-batch.yml'
  workflow_dispatch:
    inputs:
      start:
        description: 'Start index in sorted KOSPI+KOSDAQ universe'
        required: true
        default: '0'
      count:
        description: 'Batch size (1-100)'
        required: true
        default: '100'
      days:
        description: 'Trading days (1-250)'
        required: true
        default: '240'
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/investor-flex-240-diagnostics-20261022
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pykrx
        run: python -m pip install pykrx pandas
      - name: Collect investor flow
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          START: ${{ inputs.start || '0' }}
          COUNT: ${{ inputs.count || '100' }}
          DAYS: ${{ inputs.days || '240' }}
        run: |
          python scripts/export_krx_investor_market_batch.py --market BOTH --start "$START" --count "$COUNT" --days "$DAYS"
      - name: Save validated data only to isolated branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/krx-investor-data/
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified KRX investor market batch'
            git pull --rebase origin fix/investor-flex-240-diagnostics-20261022
            git push origin HEAD:fix/investor-flex-240-diagnostics-20261022
          fi
      - name: Upload batch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-investor-market-batch
          path: public/krx-investor-data/_batch_*.json
          if-no-files-found: ignore
