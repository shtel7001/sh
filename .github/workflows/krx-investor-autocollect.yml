name: KRX investor full-market automatic continuation
# Relaunch after collector script was committed. Isolated branch only. Sequential checkpoints of 200 stocks, each collected in groups of 20.
on:
  push:
    branches:
      - fix/investor-flex-240-diagnostics-20261022
    paths:
      - '.github/workflows/krx-investor-autocollect.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: krx-investor-autocollect-isolated
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/investor-flex-240-diagnostics-20261022
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pykrx pandas
      - name: Collect up to 200 tickers with 20-stock checkpoints
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          python scripts/auto_collect_krx_market.py
      - name: Commit verified results and progress
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/krx-investor-data/
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint automatic KRX investor collection'
            git pull --rebase origin fix/investor-flex-240-diagnostics-20261022
            git push origin HEAD:fix/investor-flex-240-diagnostics-20261022
          fi
      - name: Continue automatically until entire universe attempted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          p='public/krx-investor-data/_autocollect_progress.json'
          data=json.load(open(p))
          if data['nextStart']>=data['universeCount']:
              print('FINISHED: all eligible tickers attempted; failed tickers retained for retry')
          else:
              url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/krx-investor-autocollect.yml/dispatches'
              body=json.dumps({'ref':'fix/investor-flex-240-diagnostics-20261022'}).encode()
              req=urllib.request.Request(url,data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  print('Next chunk dispatched:',response.status,'nextStart:',data['nextStart'])
          PY
