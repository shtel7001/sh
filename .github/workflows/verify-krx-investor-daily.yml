name: Verify KRX investor daily data
# Trigger a fresh run with the latest secret-aware workflow definition.
on:
  push:
    branches:
      - fix/investor-flex-240-diagnostics-20261022
    paths:
      - '.github/workflows/verify-krx-investor-daily.yml'
      - 'scripts/export_krx_investor_daily.py'
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Six-digit Korean stock code'
        required: true
        default: '005930'
        type: string
      days:
        description: 'Trading days (1-250)'
        required: true
        default: '120'
        type: string
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check pykrx pandas
      - name: Collect and validate KRX investor flow
        env:
          TICKER: ${{ inputs.ticker || '005930' }}
          DAYS: ${{ inputs.days || '120' }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          if [ -z "$KRX_ID" ] || [ -z "$KRX_PW" ]; then
            echo 'KRX credentials missing: set repository Actions secrets KRX_ID and KRX_PW' >&2
            exit 3
          fi
          python scripts/export_krx_investor_daily.py --ticker "$TICKER" --days "$DAYS" --output krx-investor-daily.json
      - name: Save validated KRX sample to isolated preview branch
        if: success()
        env:
          TICKER: ${{ inputs.ticker || '005930' }}
        run: |
          mkdir -p public/krx-investor-data
          cp krx-investor-daily.json "public/krx-investor-data/${TICKER}.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "public/krx-investor-data/${TICKER}.json"
          if ! git diff --cached --quiet; then
            git commit -m "Store verified KRX ${TICKER} investor daily sample on preview branch"
            git push origin HEAD:fix/investor-flex-240-diagnostics-20261022
          fi
      - name: Upload verified JSON artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: krx-investor-daily-${{ inputs.ticker }}
          path: krx-investor-daily.json
          retention-days: 7
