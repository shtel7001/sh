name: Calc old-spike MA20 7-session return

on:
  push:
    paths:
      - '.github/workflows/calc-old-spike-ma20-d7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas pyarrow tabulate

      - name: Download 2026 KRX marcap data
        run: |
          mkdir -p backtests/data
          curl -fL --retry 3 -o backtests/data/marcap-2026.parquet https://raw.githubusercontent.com/FinanceData/marcap/master/data/marcap-2026.parquet

      - name: Calculate 3/5/7/10-session comparison
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          root = Path('backtests')
          top = pd.read_csv(root/'old_spike_ma20_20260903_top10.csv', dtype={'code': str})
          top['code'] = top['code'].str.zfill(6)
          px = pd.read_parquet(root/'data/marcap-2026.parquet')
          px['Date'] = pd.to_datetime(px['Date'])
          px['Code'] = px['Code'].astype(str).str.zfill(6)
          cutoff = pd.Timestamp('2026-09-03')

          d7_dates=[]; d7_closes=[]; d7_returns=[]
          for _, r in top.iterrows():
              g = px[(px['Code']==r['code']) & (px['Date']>cutoff)].sort_values('Date')
              b = g.iloc[6]
              close = float(b['Close'])
              ret = (close / float(r['buy_close']) - 1) * 100
              d7_dates.append(b['Date'])
              d7_closes.append(close)
              d7_returns.append(ret)

          top['d7_date'] = d7_dates
          top['d7_close'] = d7_closes
          top['d7_return_pct'] = d7_returns

          cols = ['score','market','code','name','buy_close','d3_date','d3_close','d3_return_pct','d5_date','d5_close','d5_return_pct','d7_date','d7_close','d7_return_pct','d10_date','d10_close','d10_return_pct']
          out = top[cols].copy()
          out.to_csv(root/'old_spike_ma20_20260903_3_5_7_10.csv', index=False, encoding='utf-8-sig')

          rows=[]
          for d in (3,5,7,10):
              s=top[f'd{d}_return_pct']
              rows.append({'sessions': d, 'avg_return_pct': s.mean(), 'median_return_pct': s.median(), 'win_rate_pct': (s>0).mean()*100, 'best_return_pct': s.max(), 'worst_return_pct': s.min()})
          summ=pd.DataFrame(rows)

          with (root/'old_spike_ma20_20260903_3_5_7_10.md').open('w',encoding='utf-8') as f:
              f.write('# 2026-09-03 상위10 종목 3·5·7·10거래일 보유 비교\n\n')
              f.write('2026-09-03 종가 동일금액 매수, 각 거래일째 종가 매도 가정. 수수료·세금·슬리피지 제외.\n\n')
              show=out.copy()
              for c in ['d3_date','d5_date','d7_date','d10_date']:
                  show[c]=pd.to_datetime(show[c]).dt.strftime('%Y-%m-%d')
              f.write(show.to_markdown(index=False,floatfmt='.2f'))
              f.write('\n\n## 보유기간별 요약\n\n')
              f.write(summ.to_markdown(index=False,floatfmt='.2f'))
              f.write('\n')

          print(out.to_string(index=False))
          print(summ.to_string(index=False))
          PY

      - name: Commit comparison results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtests/old_spike_ma20_20260903_3_5_7_10.csv backtests/old_spike_ma20_20260903_3_5_7_10.md
          if git diff --cached --quiet; then
            echo 'No result changes.'
          else
            git commit -m 'Add 3 5 7 10 session MA20 backtest comparison [skip ci]'
            git push
          fi
