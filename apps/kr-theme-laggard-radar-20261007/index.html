<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KR Theme Laggard Radar</title><script src="https://cdn.jsdelivr.net/npm/xlsx@latest/dist/xlsx.full.min.js"></script><style>
:root{--bg:#071019;--p:#0d1925;--p2:#102131;--line:#24374b;--t:#edf5fc;--m:#8fa6bd;--c:#55e39a;--d:#ffd166;--r:#ff7482;--b:#57d8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#163653 0,transparent 35%),var(--bg);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.w{max-width:1600px;margin:auto;padding:16px}h1{margin:0;font-size:clamp(24px,4vw,38px)}.sub,.mut{color:var(--m)}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.btns{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer;background:#183048;color:#e8f4ff}button.pri{background:linear-gradient(135deg,#40d8ff,#6ca6ff);color:#04111c}.bar{margin:15px 0;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:11px;background:#0b1722;border:1px solid var(--line);border-radius:17px}.f label{display:block;font-size:10px;color:var(--m);margin-bottom:5px}.f input{width:100%;padding:10px;border-radius:9px;background:#07121d;color:#fff;border:1px solid #294158}.acts{display:flex;gap:7px;align-items:end}.acts button{flex:1}.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.mtr{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:13px}.mtr b{font-size:28px}.mtr.c b{color:var(--c)}.mtr.d b{color:var(--d)}.status{margin:11px 0 14px;padding:11px 13px;border:1px solid var(--line);border-radius:13px;background:#0a1621;font-size:13px}.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:9px;margin-bottom:14px}.alert{background:#16131a;border:1px solid #54313a;border-radius:15px;padding:12px}.rate{color:var(--r);font-size:20px;font-weight:900}.news{margin-top:8px;display:grid;gap:5px}.news a{color:#bddbff;text-decoration:none;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:13px}.theme{background:linear-gradient(180deg,#0d1b29,#09141f);border:1px solid var(--line);border-radius:18px;overflow:hidden}.th{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.th h2{margin:0;font-size:18px}.th a{color:var(--b);text-decoration:none;font-size:12px}.cand{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}.bdg{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px}.bc{color:var(--c);background:#103025}.bd{color:var(--d);background:#332a14}.bl{color:#ffabb3;background:#351a22}.bn{color:#abd1ff;background:#10243a}.tw{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1040px}th,td{padding:8px 7px;border-bottom:1px solid #17293a;font-size:11px;text-align:right;white-space:nowrap}th{color:var(--m);background:#09141f;position:sticky;top:0}th:nth-child(2),td:nth-child(2){text-align:left}tr.crow{background:rgba(40,160,100,.09)}tr.drow{background:rgba(210,160,30,.08)}.pos{color:var(--c)}.neg{color:#ff8993}.tiny{font-size:10px;color:var(--m)}.name a{color:#fff;text-decoration:none;font-weight:800}.empty{padding:28px;text-align:center;color:var(--m)}details summary{cursor:pointer;color:#b8d3ef}.login{position:fixed;inset:0;background:rgba(2,8,14,.94);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(420px,100%);background:#0d1a27;border:1px solid #2a4058;border-radius:22px;padding:24px}.card input{width:100%;padding:14px;border-radius:11px;border:1px solid #2b435b;background:#06111b;color:white;text-align:center;font-size:18px;letter-spacing:4px}.card button{width:100%;margin-top:9px}.hide{display:none!important}.foot{margin:18px 0;color:#70869c;font-size:11px;line-height:1.5}@media(max-width:900px){.bar{grid-template-columns:repeat(2,1fr)}.acts{grid-column:1/-1}.sum{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.w{padding:10px}}</style></head><body>
<div id="login" class="login"><div class="card"><h2>1회 영구 인증</h2><p class="mut">한 번 인증하면 이 기기에 저장됩니다.</p><input id="code" inputmode="numeric" placeholder="인증번호"><button id="loginBtn" class="pri">인증하기</button><div id="lm" class="tiny" style="margin-top:8px"></div></div></div>
<div class="w"><div class="top"><div><h1>KR THEME LAGGARD RADAR</h1><div class="sub">10%+ 급등 → 뉴스 → 인포스탁 테마 → 후발 C·D 자동검출</div></div><div class="btns"><button id="notify">브라우저 알림</button><button id="auto">2분 자동감시 OFF</button></div></div>
<div class="bar"><div class="f"><label>급등 감지 %</label><input id="leader" type="number" value="10" step=".5"></div><div class="f"><label>과거 급등 %</label><input id="spike" type="number" value="15"></div><div class="f"><label>C 급등 횟수</label><input id="spikeN" type="number" value="3"></div><div class="f"><label>C 거래량 배수</label><input id="cv" type="number" value="4" step=".5"></div><div class="f"><label>D 거래량 배수</label><input id="dv" type="number" value="2.5" step=".5"></div><div class="f"><label>20MA 허용 ±%</label><input id="ma" type="number" value="3" step=".5"></div><div class="acts"><button id="scan" class="pri">지금 검색</button><button id="excel" disabled>Excel 저장</button></div></div>
<div class="sum"><div class="mtr"><b id="ml">0</b><div class="tiny">10%+ 급등</div></div><div class="mtr"><b id="mt">0</b><div class="tiny">테마</div></div><div class="mtr c"><b id="mc">0</b><div class="tiny">C 충족</div></div><div class="mtr d"><b id="md">0</b><div class="tiny">D 충족</div></div></div><div id="status" class="status">준비됨.</div><div id="alerts" class="alerts"></div><div id="grid" class="grid"><div class="empty">검색을 누르면 결과가 표시됩니다.</div></div><div class="foot">네이버 시세/일봉/수급 + 인포스탁 국내 테마 DB를 우선 사용합니다. 인포스탁 연결이 제한되면 뉴스 기반 테마 추론으로 표시합니다. 조건 탐색용이며 투자 판단은 별도 검증이 필요합니다.</div></div>
<script>
const E=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),num=v=>Number(v)||0,fmt=v=>new Intl.NumberFormat('ko-KR').format(Math.round(num(v))),pct=v=>(num(v)>=0?'+':'')+num(v).toFixed(2)+'%';let latest=null,timer=null,known=new Set();
function token(){return localStorage.getItem('theme_radar_token')||''}async function api(q){let r=await fetch('/api/app?'+q,{headers:{authorization:'Bearer '+token()}});if(r.status===401){localStorage.removeItem('theme_radar_token');E('login').classList.remove('hide');throw Error('인증이 필요합니다.')}let j=await r.json();if(!r.ok)throw Error(j.error||'오류');return j}async function pool(a,n,fn){let out=new Array(a.length),i=0;async function w(){for(;;){let k=i++;if(k>=a.length)return;try{out[k]=await fn(a[k])}catch(e){out[k]={__e:e.message}}}}await Promise.all(Array.from({length:Math.min(n,a.length)},w));return out}
async function login(){E('lm').textContent='확인 중...';let r=await fetch('/api/app?action=login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:E('code').value.trim()})}),j=await r.json();if(!r.ok)return E('lm').textContent=j.error||'실패';localStorage.setItem('theme_radar_token',j.token);E('login').classList.add('hide');scan()}
function progress(){let p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false,weekday:'short'}).formatToParts(new Date()).map(x=>[x.type,x.value]));if(['Sat','Sun'].includes(p.weekday))return 1;let m=+p.hour*60 + +p.minute;return m<=540?.08:m>=930?1:Math.max(.08,Math.min(1,(m-540)/390))}
function calc(d,cfg){let q=d.quote,h=d.hist||[],iv=d.inv||[],today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date()).replaceAll('-',''),prior=h.filter(x=>x.date!==today),last20=prior.slice(-20),av=last20.reduce((s,x)=>s+num(x.volume),0)/Math.max(1,last20.length),vr=av?num(q.volume)/(av*progress()):0,ma20=last20.reduce((s,x)=>s+num(x.close),0)/Math.max(1,last20.length),mad=ma20?(num(q.price)/ma20-1)*100:999,mas=Math.abs(mad)<=cfg.ma,sp=[];let z=h.slice(-480);for(let i=1;i<z.length;i++){let x=(num(z[i].close)/num(z[i-1].close)-1)*100;if(x>=cfg.spike)sp.push({date:z[i].date.slice(0,4)+'-'+z[i].date.slice(4,6)+'-'+z[i].date.slice(6),pct:+x.toFixed(2)})}let f=iv.slice(0,5),fs=f.reduce((s,x)=>s+num(x.foreign),0),fp=f.filter(x=>num(x.foreign)>0).length,fb=fs>0&&fp>=3,cr=[...iv].reverse(),cum=0,ser=[];cr.forEach(x=>{cum+=num(x.institution);ser.push(cum)});let ti=-1;for(let i=1;i<ser.length;i++)if(ser[i-1]<=0&&ser[i]>0)ti=i;let it=ti>=0&&ti>=ser.length-5&&(ser.at(-1)||0)>0,c= q.rate<cfg.leader&&fb&&sp.length>=cfg.spikeN&&vr>=cfg.cv,dd=q.rate<cfg.leader&&it&&mas&&vr>=cfg.dv,score=(fb?20:0)+(sp.length>=cfg.spikeN?20:0)+(vr>=cfg.cv?20:0)+(it?18:0)+(mas?12:0)+(vr>=cfg.dv?10:0)+(c?40:0)+(dd?35:0);return{...q,volumeRatio:+vr.toFixed(2),ma20:+ma20.toFixed(2),maDistance:+mad.toFixed(2),ma20Support:mas,spikes:sp,foreign5Sum:fs,foreignPositiveDays:fp,foreign5Buy:fb,institutionCum:ser.at(-1)||0,institutionTurnPositive:it,cPass:c,dPass:dd,score}}
function cfg(){return{leader:+E('leader').value||10,spike:+E('spike').value||15,spikeN:+E('spikeN').value||3,cv:+E('cv').value||4,dv:+E('dv').value||2.5,ma:+E('ma').value||3}}
async function scan(){let b=E('scan');b.disabled=true;b.textContent='검색 중...';E('status').textContent='급등주 → 뉴스 → 인포스탁 테마 → 480일/수급/20MA 분석 중...';try{let c=cfg(),L=(await api('action=leaders&threshold='+c.leader)).leaders||[],LI=await pool(L.slice(0,20),5,async l=>({...l,...await api('action=leader&code='+l.code+'&name='+encodeURIComponent(l.name))})),map=new Map();LI.filter(x=>!x.__e).forEach(l=>(l.themes||[]).forEach(t=>{let k=t.url||t.name;if(!map.has(k))map.set(k,{...t,leaders:[l]});else map.get(k).leaders.push(l)}));let themes=(await pool([...map.values()].slice(0,8),2,async t=>{let mem=[...(t.members||[])];(t.leaders||[]).forEach(l=>{if(!mem.some(x=>x.code===l.code))mem.unshift({code:l.code,name:l.name})});mem=mem.slice(0,35);let rows=(await pool(mem,6,async m=>calc(await api('action=member&code='+m.code),c))).filter(x=>!x.__e);rows.sort((a,b)=>b.rate-a.rate||b.score-a.score);rows.forEach((x,i)=>{x.rank=i+1;x.isLeader=x.rate>=c.leader});return{...t,members:rows,candidates:rows.filter(x=>!x.isLeader&&(x.cPass||x.dPass))}})).filter(x=>!x.__e),counts={leaders:L.length,themes:themes.length,c:themes.reduce((s,t)=>s+t.members.filter(x=>x.cPass).length,0),d:themes.reduce((s,t)=>s+t.members.filter(x=>x.dPass).length,0)};latest={at:new Date().toISOString(),cfg:c,leaders:LI.filter(x=>!x.__e),themes,counts};render(latest);E('status').innerHTML='<b>완료.</b> 급등 '+counts.leaders+'개 · 테마 '+counts.themes+'개 · C '+counts.c+'개 · D '+counts.d+'개'}catch(e){E('status').textContent='오류: '+e.message}finally{b.disabled=false;b.textContent='지금 검색'}}
function render(d){E('ml').textContent=d.counts.leaders;E('mt').textContent=d.counts.themes;E('mc').textContent=d.counts.c;E('md').textContent=d.counts.d;E('excel').disabled=false;E('alerts').innerHTML=d.leaders.map((x,i)=>'<div class="alert"><div style="display:flex;justify-content:space-between"><div><b>'+(i===0?'대장':i===1?'2등':'급등')+' · '+esc(x.name)+'</b><div class="tiny">'+x.code+' · '+esc(x.market)+'</div></div><div class="rate">'+pct(x.rate)+'</div></div><div class="news">'+((x.news||[]).slice(0,3).map(n=>'<a target="_blank" href="'+esc(n.link)+'">'+esc(n.title)+'</a>').join('')||'<span class="tiny">뉴스 없음</span>')+'</div></div>').join('');E('grid').innerHTML=d.themes.length?d.themes.map(themeHTML).join(''):'<div class="empty">연결된 테마가 없습니다.</div>';notifyNew(d)}
function themeHTML(t){let tags=t.candidates.length?t.candidates.slice(0,8).map(x=>'<span class="bdg '+(x.cPass?'bc':'bd')+'">'+(x.cPass?'C':'D')+' · '+esc(x.name)+' '+pct(x.rate)+'</span>').join(''):'<span class="bdg bn">C/D 완전충족 없음</span>',rows=t.members.map(r=>{let f=r.cPass?'<span class="bdg bc">C</span>':r.dPass?'<span class="bdg bd">D</span>':r.isLeader?'<span class="bdg bl">대장권</span>':'-',sp=r.spikes||[];return'<tr class="'+(r.cPass?'crow':r.dPass?'drow':'')+'"><td>'+r.rank+'</td><td class="name"><a target="_blank" href="https://finance.naver.com/item/main.naver?code='+r.code+'">'+esc(r.name||r.code)+'</a><div class="tiny">'+r.code+'</div></td><td class="'+(r.rate>=0?'pos':'neg')+'"><b>'+pct(r.rate)+'</b></td><td>'+fmt(r.price)+'</td><td>'+f+'</td><td><b>'+r.volumeRatio.toFixed(2)+'×</b></td><td class="'+(r.foreign5Buy?'pos':'')+'">'+fmt(r.foreign5Sum)+'<div class="tiny">양수 '+r.foreignPositiveDays+'/5</div></td><td class="'+(r.institutionTurnPositive?'pos':'')+'">'+(r.institutionTurnPositive?'전환':'-')+'<div class="tiny">'+fmt(r.institutionCum)+'</div></td><td class="'+(r.ma20Support?'pos':'')+'">'+(r.ma20Support?'지지권':'-')+'<div class="tiny">'+r.maDistance.toFixed(2)+'%</div></td><td><details><summary>'+sp.length+'회</summary>'+sp.map(s=>'<div>'+s.date+' <b>'+pct(s.pct)+'</b></div>').join('')+'</details></td><td>'+r.score+'</td></tr>'}).join('');return'<section class="theme"><div class="th"><div><h2>'+esc(t.name)+'</h2><div class="tiny">'+esc(t.source||'')+' · 상승률순</div></div><a target="_blank" href="'+esc(t.url||'https://infostock.co.kr/Theme/ThemeDB')+'">인포스탁 ↗</a></div><div class="cand">'+tags+'</div><div class="tw"><table><thead><tr><th>순위</th><th>종목</th><th>등락률</th><th>현재가</th><th>판정</th><th>거래량</th><th>외국인5일</th><th>기관양수</th><th>20MA</th><th>480일 급등</th><th>점수</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>'}
function excel(){if(!latest||!window.XLSX)return alert('Excel 모듈을 불러오지 못했습니다.');let wb=XLSX.utils.book_new(),sum=[['구분','값'],['생성시각',latest.at],['급등 기준',latest.cfg.leader+'%'],['테마 수',latest.counts.themes],['C 충족',latest.counts.c],['D 충족',latest.counts.d],['C 기준','외국인5일 매수 + '+latest.cfg.spike+'% 급등 '+latest.cfg.spikeN+'회 + 거래량 '+latest.cfg.cv+'배'],['D 기준','기관 양수전환 + 20MA ±'+latest.cfg.ma+'% + 거래량 '+latest.cfg.dv+'배']];XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),'요약');let sp=[['테마','종목','코드','급등일','급등률%']];latest.themes.forEach((t,i)=>{let a=[['순위','종목','코드','현재가','등락률%','판정','거래량배수','외국인5일','외국인양수일','기관양수전환','기관누적','20MA','20MA거리%','15%급등횟수','점수']];t.members.forEach(r=>{a.push([r.rank,r.name,r.code,r.price,r.rate,r.cPass?'C':r.dPass?'D':r.isLeader?'대장권':'-',r.volumeRatio,r.foreign5Sum,r.foreignPositiveDays,r.institutionTurnPositive?'Y':'',r.institutionCum,r.ma20,r.maDistance,r.spikes.length,r.score]);r.spikes.forEach(s=>sp.push([t.name,r.name,r.code,s.date,s.pct]))});let name=(i+1+'_'+t.name).replace(/[\\/*?:\[\]]/g,' ').slice(0,31);XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),name)});XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sp),'480일 급등이력');XLSX.writeFile(wb,'theme-laggard-radar-'+new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date())+'.xlsx')}
function notifyNew(d){if(!('Notification'in window)||Notification.permission!=='granted')return;d.leaders.forEach(x=>{if(!known.has(x.code))new Notification(x.name+' '+pct(x.rate)+' 급등 감지',{body:'뉴스와 테마 후발주를 확인하세요.'});known.add(x.code)})}function auto(){if(timer){clearInterval(timer);timer=null;E('auto').textContent='2분 자동감시 OFF'}else{scan();timer=setInterval(scan,120000);E('auto').textContent='2분 자동감시 ON'}}
E('loginBtn').onclick=login;E('code').onkeydown=e=>{if(e.key==='Enter')login()};E('scan').onclick=scan;E('excel').onclick=excel;E('auto').onclick=auto;E('notify').onclick=async()=>{if('Notification'in window){let x=await Notification.requestPermission();E('notify').textContent=x==='granted'?'알림 ON':'알림 차단됨'}};if(token()){E('login').classList.add('hide');scan()}
</script></body></html>
