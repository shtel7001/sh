<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>S&P500 EPS · 매출 성장 데이터 레이더</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font:14px system-ui,-apple-system,"Noto Sans KR",sans-serif}button,input,select{font:inherit}.wrap{max-width:1780px;margin:auto;padding:18px}.hero{display:flex;justify-content:space-between;gap:12px;align-items:center}.hero h1{margin:0;font-size:27px}.muted{color:#66758f}.card{background:#fff;border:1px solid #dbe4ef;border-radius:15px;box-shadow:0 6px 22px #243b5510;margin:12px 0}.controls{padding:14px;display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:9px}.f label{display:block;font-size:11px;color:#66758f;margin-bottom:4px}.f input,.f select{width:100%;height:39px;border:1px solid #ced9e6;border-radius:9px;padding:0 9px;background:#fff}.actions{display:flex;gap:7px;align-items:end}.btn{height:39px;border:0;border-radius:9px;padding:0 13px;font-weight:800;cursor:pointer}.primary{background:#155eef;color:white}.green{background:#087443;color:white}.ghost{background:#eef2f7}.redbtn{background:#fff1f0;color:#b42318;border:1px solid #ffd2ce}.btn:disabled{opacity:.45;cursor:not-allowed}.notice{padding:10px 14px}.warn{background:#fff8e8;border-color:#fedf89;color:#8a4b08}.ok{background:#ecfdf3;border-color:#abefc6;color:#067647}.progress{height:8px;background:#e8eef6;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#155eef,#0e9f9a);transition:.2s}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.stat{padding:12px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:#66758f}.tabs{display:flex;flex-wrap:wrap;gap:5px;padding:10px 10px 0}.tab{border:1px solid #dbe4ef;background:#f8fafc;border-radius:9px 9px 0 0;padding:8px 11px;font-weight:700;cursor:pointer}.tab.on{background:#fff;color:#155eef;border-bottom-color:#fff}.bar{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px}.bar input{width:300px;max-width:45vw;height:37px;border:1px solid #ced9e6;border-radius:9px;padding:0 9px}.tablewrap{overflow:auto;max-height:69vh;border-top:1px solid #e4ebf3}table{border-collapse:separate;border-spacing:0;min-width:100%;width:max-content;font-size:12px}th,td{padding:8px 9px;border-bottom:1px solid #edf1f6;border-right:1px solid #f1f4f8;white-space:nowrap}th{position:sticky;top:0;background:#f8fafc;color:#536278;z-index:2;cursor:pointer}.num{text-align:right}.pos{color:#087443;font-weight:750}.neg{color:#b42318;font-weight:750}.ticker{color:#1746a2;font-weight:800;text-decoration:none}.pill{padding:2px 7px;border-radius:20px;background:#ecfdf3;color:#067647;font-weight:700}.pill.no{background:#fef3f2;color:#b42318}.auth{position:fixed;inset:0;background:linear-gradient(135deg,#0e172a,#193b7a);display:grid;place-items:center;z-index:99}.authbox{width:min(430px,92vw);background:#fff;border-radius:20px;padding:25px;box-shadow:0 20px 70px #0007}.authbox input{width:100%;height:46px;border:1px solid #ccd7e4;border-radius:10px;padding:0 12px;font-size:18px}.authbox button{width:100%;margin-top:9px}.hide{display:none!important}.subnote{font-size:11px;color:#66758f;line-height:1.55;margin-top:5px}@media(max-width:900px){.controls{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.hero{align-items:flex-start;flex-direction:column}.bar{align-items:stretch;flex-direction:column}.bar input{max-width:none;width:100%}}
</style>
</head>
<body>
<section id="auth" class="auth"><div class="authbox"><h2>개인 영구 인증</h2><p class="muted">처음 한 번 인증하면 이 브라우저에 저장됩니다. 다른 PC·휴대폰에서도 같은 인증번호를 다시 입력해 계속 사용할 수 있습니다.</p><input id="code" type="password" inputmode="numeric" placeholder="인증번호"><button id="login" class="btn primary">인증하고 열기</button><p id="authmsg" class="muted"></p></div></section>
<main class="wrap">
<header class="hero"><div><h1>S&P500 EPS · 매출 성장 데이터 레이더</h1><div class="muted">현재 S&P500 구성종목 · Yahoo Finance · 성장률 · 목표가 · EPS/PER · 실적예정일</div><div class="subnote">기본 조건은 업로드하신 원본과 동일하게 EPS Q/Q ≥ 5%, 매출 Q/Q ≥ 0%입니다.</div></div><button id="logout" class="btn ghost">인증 초기화</button></header>
<section class="card controls">
  <div class="f"><label>EPS Q/Q 최소(%)</label><input id="eps" type="number" step="0.1" value="5"></div>
  <div class="f"><label>매출 Q/Q 최소(%)</label><input id="rev" type="number" step="0.1" value="0"></div>
  <div class="f"><label>한 번에 상세조회</label><select id="batch"><option>10</option><option selected>20</option></select></div>
  <div class="f"><label>조회 대상</label><input value="S&P500 전체 구성종목" readonly></div>
  <div class="actions"><button id="run" class="btn primary">Yahoo 전체 조회 시작</button></div>
  <div class="actions"><button id="excel" class="btn green">Excel .xlsx 저장</button><button id="stop" class="btn redbtn" disabled>중지</button></div>
</section>
<section id="notice" class="card notice">인증 후 Yahoo 조회를 시작하세요.</section>
<section class="card" style="padding:10px"><div class="progress"><i id="prog"></i></div></section>
<section class="stats"><div class="card stat"><b id="sTop">0</b><span>S&P500 구성 티커</span></div><div class="card stat"><b id="sDone">0</b><span>상세조회 완료</span></div><div class="card stat"><b id="sCond">0</b><span>EPS·매출 조건충족</span></div><div class="card stat"><b id="sErr">0</b><span>조회오류</span></div><div class="card stat"><b id="sTime">-</b><span>마지막 조회</span></div></section>
<section class="card"><div id="tabs" class="tabs"></div><div class="bar"><b id="info"></b><input id="search" placeholder="티커 · 회사명 · 섹터 · 산업 검색"></div><div class="tablewrap"><table><thead></thead><tbody></tbody></table></div></section>
</main>
<script>
const $=s=>document.querySelector(s),API='/api/sp500-growth-radar-20260927',KEY='sp500GrowthRadarPermanent20260927';
let S={key:'',universe:[],details:[],errors:[],tab:'all',sort:'rank',dir:1,stop:false};
const tabs=[['all','전체상세'],['condition','EPS·매출조건충족'],['eps','EPS성장률순'],['rev','매출성장률순'],['top','S&P500_시총순위'],['errors','조회오류']];
const D=[['rank','시총순위'],['symbol','티커'],['name','회사명'],['exchange','거래소'],['marketCapB','시가총액(십억$)'],['epsGrowthPct','EPS Q/Q(%)'],['revenueGrowthPct','매출 Q/Q(%)'],['currentPrice','현재가($)'],['targetMeanPrice','목표가평균($)'],['upsidePct','상승여력(%)'],['trailingEps','Trailing EPS'],['forwardEps','Forward EPS'],['trailingPE','Trailing PER'],['forwardPE','Forward PER'],['sector','섹터'],['industry','산업'],['earningsDate','실적발표예정'],['condition','조건충족'],['source','데이터소스'],['error','오류']];
const T=[['rank','시총순위'],['symbol','티커'],['name','회사명'],['exchange','거래소'],['marketCapB','시가총액(십억$)'],['source','데이터소스']];
function notice(t,type=''){let n=$('#notice');n.textContent=t;n.className='card notice'+(type==='warn'?' warn':type==='ok'?' ok':'')}
function authHeaders(){return{'x-access-code':S.key,'content-type':'application/json'}}
async function login(code){S.key=code.trim();let r=await fetch(API+'?action=auth',{headers:authHeaders()});if(!r.ok)throw Error('인증번호가 올바르지 않습니다.');localStorage.setItem(KEY,S.key);$('#auth').classList.add('hide')}
async function boot(){let k=localStorage.getItem(KEY);if(k){try{await login(k);notice('인증 완료. S&P500 전체 Yahoo 조회를 시작할 수 있습니다.','ok')}catch{localStorage.removeItem(KEY)}}}
$('#login').onclick=async()=>{try{$('#authmsg').textContent='확인 중...';await login($('#code').value);$('#authmsg').textContent='';notice('인증 완료. S&P500 전체 Yahoo 조회를 시작할 수 있습니다.','ok')}catch(e){$('#authmsg').textContent=e.message}};
$('#code').onkeydown=e=>{if(e.key==='Enter')$('#login').click()};
$('#logout').onclick=()=>{localStorage.removeItem(KEY);location.reload()};
function cond(r){return Number.isFinite(Number(r.epsGrowthPct))&&Number.isFinite(Number(r.revenueGrowthPct))&&Number(r.epsGrowthPct)>=Number($('#eps').value)&&Number(r.revenueGrowthPct)>=Number($('#rev').value)}
function calc(r){let c=r.currentPrice,t=r.targetMeanPrice;return{...r,upsidePct:r.upsidePct??(c&&t?(t/c-1)*100:null),condition:cond(r)}}
function rerank(){let ordered=[...S.details].sort((a,b)=>(b.marketCapB??-1e99)-(a.marketCapB??-1e99));ordered.forEach((r,i)=>r.rank=i+1);let map=new Map(ordered.map(r=>[r.symbol,r.rank]));S.details.forEach(r=>{r.rank=map.get(r.symbol)||null;r.condition=cond(r)});S.errors.forEach(r=>r.rank=map.get(r.symbol)||null)}
function stats(){rerank();let c=S.details.filter(cond).length;$('#sTop').textContent=S.universe.length;$('#sDone').textContent=S.details.length;$('#sCond').textContent=c;$('#sErr').textContent=S.errors.length}
function tabsRender(){let el=$('#tabs');el.innerHTML='';tabs.forEach(([id,n])=>{let b=document.createElement('button');b.className='tab'+(S.tab===id?' on':'');b.textContent=n;b.onclick=()=>{S.tab=id;S.sort=id==='top'?'rank':'rank';S.dir=1;tabsRender();render()};el.appendChild(b)})}
function topRows(){rerank();let good=[...S.details].sort((a,b)=>(a.rank??1e99)-(b.rank??1e99)).map(r=>({rank:r.rank,symbol:r.symbol,name:r.name,exchange:r.exchange,marketCapB:r.marketCapB,source:r.source||'Yahoo Finance'}));let misses=S.errors.map(r=>({rank:'',symbol:r.symbol,name:r.name||r.symbol,exchange:r.exchange||'',marketCapB:null,source:r.source||'Yahoo Finance'}));return [...good,...misses]}
function rows(){rerank();let a=S.tab==='top'?topRows():S.tab==='errors'?S.errors:S.tab==='condition'?S.details.filter(cond):S.details;if(S.tab==='eps')a=[...S.details].sort((a,b)=>(b.epsGrowthPct??-1e99)-(a.epsGrowthPct??-1e99));if(S.tab==='rev')a=[...S.details].sort((a,b)=>(b.revenueGrowthPct??-1e99)-(a.revenueGrowthPct??-1e99));let q=$('#search').value.toLowerCase().trim();if(q)a=a.filter(r=>[r.symbol,r.name,r.sector,r.industry].some(v=>String(v||'').toLowerCase().includes(q)));if(S.sort&&S.tab!=='eps'&&S.tab!=='rev'){let k=S.sort,d=S.dir;a=[...a].sort((x,y)=>{let A=x[k],B=y[k];if(A==null||A==='')return 1;if(B==null||B==='')return-1;if(typeof A==='number'&&typeof B==='number')return(A-B)*d;return String(A).localeCompare(String(B))*d})}return a}
function fmt(v,k){if(v==null||v==='')return'';if(typeof v==='number')return k==='rank'?v.toFixed(0):v.toLocaleString('ko-KR',{maximumFractionDigits:3});return v}
function render(){let a=rows(),cols=S.tab==='top'?T:D;$('#info').textContent=(tabs.find(x=>x[0]===S.tab)||['',''])[1]+' · '+a.length+'개';let h=$('thead');h.innerHTML='<tr>'+cols.map(([k,n])=>`<th data-k="${k}">${n}${S.sort===k?(S.dir===1?' ▲':' ▼'):''}</th>`).join('')+'</tr>';h.querySelectorAll('th').forEach(x=>x.onclick=()=>{let k=x.dataset.k;if(S.sort===k)S.dir*=-1;else{S.sort=k;S.dir=-1}render()});$('tbody').innerHTML=a.map(r=>'<tr>'+cols.map(([k])=>{let v=k==='condition'?cond(r):r[k],cl='';if(['marketCapB','epsGrowthPct','revenueGrowthPct','currentPrice','targetMeanPrice','upsidePct','trailingEps','forwardEps','trailingPE','forwardPE','rank'].includes(k))cl='num';if(['epsGrowthPct','revenueGrowthPct','upsidePct'].includes(k)&&v!=null)cl+=' '+(v>=0?'pos':'neg');if(k==='symbol')return`<td><a class="ticker" target="_blank" rel="noreferrer" href="https://finance.yahoo.com/quote/${encodeURIComponent(v||'')}">${v||''}</a></td>`;if(k==='condition')return`<td><span class="pill ${v?'':'no'}">${v?'충족':'미충족'}</span></td>`;return`<td class="${cl}">${fmt(v,k)}</td>`}).join('')+'</tr>').join('')}
async function run(){if(S.key==='')return notice('먼저 인증하세요.','warn');let btn=$('#run');btn.disabled=true;$('#stop').disabled=false;S.stop=false;S.universe=[];S.details=[];S.errors=[];stats();render();$('#prog').style.width='0%';try{notice('현재 S&P500 구성종목 목록을 불러오는 중...');let ur=await fetch(API+'?action=universe',{headers:authHeaders()}),uj=await ur.json();if(!ur.ok||!uj.ok)throw Error(uj.error||'S&P500 구성종목 조회 실패');S.universe=uj.rows||[];$('#sTop').textContent=S.universe.length;notice(`S&P500 구성종목 ${S.universe.length}개 확보. Yahoo 상세 재무 데이터를 조회합니다.`);let bs=Number($('#batch').value);for(let i=0;i<S.universe.length;i+=bs){if(S.stop)break;let ch=S.universe.slice(i,i+bs),r=await fetch(API+'?action=details',{method:'POST',headers:authHeaders(),body:JSON.stringify({symbols:ch.map(x=>x.symbol)})}),j=await r.json();if(!r.ok)throw Error(j.error||'detail error');for(let z of j.rows||[]){let base=ch.find(x=>x.symbol===z.symbol)||{};if(z.ok)S.details.push(calc({...base,...z.data,name:z.data.name||base.name,sector:z.data.sector||base.sector,industry:z.data.industry||base.industry}));else S.errors.push({...base,error:z.error||'조회오류',source:'Yahoo Finance'})}let done=Math.min(i+ch.length,S.universe.length);$('#prog').style.width=(done/S.universe.length*100).toFixed(1)+'%';stats();if(i%40===0)render();await new Promise(r=>setTimeout(r,90))}rerank();S.tab='all';tabsRender();render();$('#sTime').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});if(S.stop)notice(`사용자 중지: 상세 ${S.details.length}개 · 오류 ${S.errors.length}개`,'warn');else notice(`조회 완료: 상세 ${S.details.length}개 · 조건충족 ${S.details.filter(cond).length}개 · 오류 ${S.errors.length}개`,'ok')}catch(e){notice('조회 실패: '+e.message,'warn')}finally{btn.disabled=false;$('#stop').disabled=true}}
$('#run').onclick=run;$('#stop').onclick=()=>{S.stop=true;$('#stop').disabled=true;notice('현재 배치가 끝나면 중지합니다.','warn')};
function sheet(rows,cols){return XLSX.utils.json_to_sheet(rows.map(r=>Object.fromEntries(cols.map(([k,n])=>[n,k==='condition'?(cond(r)?'충족':'미충족'):r[k]??'']))))}
function excel(){if(!S.universe.length)return notice('먼저 데이터를 조회하세요.','warn');if(typeof XLSX==='undefined')return notice('Excel 모듈을 불러오지 못했습니다.','warn');rerank();let all=[...S.details].sort((a,b)=>(a.rank??1e99)-(b.rank??1e99)),good=all.filter(cond),eps=[...good].sort((a,b)=>(b.epsGrowthPct??-1e99)-(a.epsGrowthPct??-1e99)),rev=[...good].sort((a,b)=>(b.revenueGrowthPct??-1e99)-(a.revenueGrowthPct??-1e99)),top=topRows(),errs=S.errors;let wb=XLSX.utils.book_new();let sets=[['S&P500_시총순위',top,T],['전체상세',all,D],['EPS_매출조건충족',good,D],['EPS성장률순',eps,D],['매출성장률순',rev,D],['조회오류',errs,D]];sets.forEach(([name,data,cols])=>{let ws=sheet(data,cols);ws['!cols']=cols.map(([k])=>({wch:k==='name'?31:k==='industry'?30:k==='sector'?22:k==='error'?28:15}));XLSX.utils.book_append_sheet(wb,ws,name)});let d=new Date(),p=n=>String(n).padStart(2,'0'),stamp=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;XLSX.writeFile(wb,`SP500_EPS_매출_스크리닝_${stamp}.xlsx`,{compression:true});notice('Excel .xlsx 저장을 시작했습니다.','ok')}
$('#excel').onclick=excel;$('#search').oninput=render;$('#eps').oninput=()=>{stats();render()};$('#rev').oninput=()=>{stats();render()};tabsRender();render();boot();
</script>
</body>
</html>
